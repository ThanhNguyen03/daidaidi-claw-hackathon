# =============================================================================
# nginx vhost for zah-28.123c.vn  ->  /etc/nginx/conf.d/zah-28.conf
# =============================================================================
# An exact server_name beats the pre-existing "*.123c.vn" wildcard block, so
# this file takes over the team subdomain without touching star.123c.vn.conf.
# TLS reuses the wildcard cert already installed by the organizers.

server {
    listen 80;
    server_name zah-28.123c.vn;

    location ~ /\. { deny all; access_log off; log_not_found off; }

    return 301 https://$host$request_uri;
}

server {
    # Old-style combined directive — this nginx predates 1.25's `http2 on;`
    listen 443 ssl http2;
    server_name zah-28.123c.vn;

    ssl_certificate     /etc/nginx/certs/123c.vn.pem;
    ssl_certificate_key /etc/nginx/certs/123c.vn.key;
    ssl_dhparam         /etc/nginx/certs/dhparams.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:zah28SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 50M;

    access_log /var/log/nginx/zah-28.access.log;
    error_log  /var/log/nginx/zah-28.error.log;

    location ~ /\. { deny all; access_log off; log_not_found off; }

    # ---- Backend API -------------------------------------------------------
    # Trailing slash on proxy_pass strips the /api prefix:
    #   /api/chat/stream  ->  backend  /chat/stream
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # SSE: the agent streams tokens for minutes at a time. Any buffering
        # here makes the chat look frozen until the whole answer completes.
        proxy_buffering          off;
        proxy_cache              off;
        gzip                     off;
        chunked_transfer_encoding on;

        # A full proposal run (4 analysis skills -> assembler -> deck) can take
        # several minutes; the per-skill timeout in the app is already 270s.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ---- Frontend ----------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 120s;
    }
}
